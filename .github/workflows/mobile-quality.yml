name: Mobile quality

on:
  push:
    paths:
      - "apps/mobile/**"
      - "Makefile"
      - ".github/workflows/mobile-quality.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "Makefile"
      - ".github/workflows/mobile-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Mobile static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: apps/mobile/.nvmrc
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run non-watch tests
        run: npm run test

      - name: Build web bundle
        run: npm run build:web
